name: Refresh Kinopoisk profile
on:
  workflow_dispatch:
    inputs:
      public_profile:
        description: 'Публичный профиль КП для публикации. Оставьте пустым для обновления текущего.'
        required: false
        type: string
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: kinopoisk-profile-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read the full public watchlist and viewing history
        env:
          KP_PROFILE: ${{ inputs.public_profile }}
        run: |
          if [ -z "$KP_PROFILE" ]; then
            if [ ! -f feed/profile.json ]; then exit 0; fi
            KP_PROFILE=$(jq -er '.profile' feed/profile.json)
          fi
          python3 profile_server.py "$KP_PROFILE" --curl --sync-only --cache feed/profile.json
      - name: Publish a complete snapshot when the lists change
        run: |
          if [ ! -f feed/profile.json ]; then exit 0; fi
          git add -- feed/profile.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Kinopoisk lists'
            git push
          fi
